<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comedian per Gaza 2026 — Raccolta fondi</title>
<meta name="description" content="Raccolta fondi di Comedian per Gaza 2026 per la Fondazione Soleterre: dona su GoFundMe.">
<style>
  :root {
    --rosso: #E41B1F;
    --verde: #159246;
    --verde-ui: #138741;
    --nero: #171616;
    --panna: #F2F2F1;
    --bianco: #FFFFFF;
    --grigio: #6E6864;
    --r: 18px;
    --bordo: clamp(3px, .35vw, 6px);
    --font: "Helvetica Neue", Helvetica, Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bianco); color: var(--nero);
    font: 16px/1.4 var(--font); -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }
  body.idle, body.idle * { cursor: none !important; }

  .pagina { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- testata: logo grande al centro, timer a destra ---------- */
  .testata {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: clamp(10px, 2vh, 28px) clamp(18px, 4vw, 72px) 0;
    max-width: 1920px; width: 100%; margin: 0 auto;
  }
  .logo { grid-column: 2; display: block; height: clamp(110px, 21vh, 260px); width: auto; }
  /* Il timer è nascosto: si mostra solo con ?timer=1 nell'indirizzo. */
  .timer { display: none; }
  .con-timer .timer { display: block; }
  .timer {
    grid-column: 3; justify-self: end; text-align: right;
    border: var(--bordo) solid var(--nero); border-radius: var(--r); overflow: hidden;
    background: var(--bianco);
  }
  .timer .etichetta {
    display: block; background: var(--verde); color: var(--bianco);
    padding: .35em .8em; font-size: clamp(12px, 1.05vw, 22px); font-weight: 800;
    text-transform: uppercase; letter-spacing: .06em; text-align: center;
  }
  .timer.prima .etichetta { background: var(--rosso); }
  .timer .tempo {
    display: block; padding: .12em .45em .16em;
    font-size: clamp(30px, 4.2vw, 84px); line-height: 1; font-weight: 800;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em; text-align: center;
  }

  /* ---------- palco: widget + Soleterre a sinistra, QR a destra, stessa altezza ---------- */
  .stage {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
    gap: clamp(20px, 3.2vw, 64px);
    align-items: stretch;
    padding: clamp(12px, 2.2vh, 32px) clamp(18px, 4vw, 72px) clamp(12px, 2vh, 28px);
    max-width: 1920px; width: 100%; margin: 0 auto;
  }
  .sinistra { display: flex; flex-direction: column; gap: clamp(12px, 2.2vh, 30px); }

  .widget-card {
    flex: 1; display: flex; flex-direction: column;
    border: var(--bordo) solid var(--nero); border-radius: var(--r);
    background: var(--bianco); overflow: hidden;
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--nero); color: var(--bianco);
    padding: .55em .9em;
    font-size: clamp(14px, 1.25vw, 26px); font-weight: 800; text-transform: uppercase;
  }
  .live { display: inline-flex; align-items: center; gap: .45em; font-size: .78em; letter-spacing: .04em; }
  .live::before {
    content: ""; width: .7em; height: .7em; border-radius: 50%; background: var(--rosso);
    animation: pulsa 1.6s ease-in-out infinite;
  }
  @keyframes pulsa { 50% { opacity: .25; } }
  .widget-body {
    flex: 1; padding: clamp(10px, 1.4vw, 24px);
    display: flex; justify-content: center; align-items: center; overflow: hidden;
  }
  .gfm-scala { flex: none; position: relative; }
  .gfm-embed { width: 480px; position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .gfm-embed iframe { display: block; border: 0; }
  .fallback {
    display: none; width: 100%; text-align: center; padding: 10px 6px;
    font-size: clamp(16px, 1.5vw, 28px); font-weight: 700;
  }
  .fallback a { color: var(--verde-ui); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; }
  .widget-card.ko .gfm-scala { display: none; }
  .widget-card.ko .fallback { display: block; }

  .dest {
    display: flex; align-items: stretch;
    border: var(--bordo) solid var(--nero); border-radius: var(--r); overflow: hidden;
  }
  .dest-testo {
    flex: 1; background: var(--rosso); color: var(--bianco);
    padding: .7em 1em; display: flex; align-items: center;
    font-size: clamp(15px, 1.3vw, 27px); line-height: 1.22; font-weight: 700;
  }
  .dest-testo b { font-weight: 800; text-transform: uppercase; }
  .dest-logo {
    flex: 0 0 44%; background: var(--bianco);
    display: flex; align-items: center; justify-content: center;
    padding: clamp(10px, 1.3vw, 24px) clamp(12px, 1.6vw, 30px);
  }
  .dest-logo img { display: block; width: 100%; height: auto; }

  /* QR: occupa tutta l'altezza della colonna di sinistra */
  .qr-col {
    display: flex; flex-direction: column; color: inherit; text-decoration: none;
    border: var(--bordo) solid var(--nero); border-radius: var(--r); overflow: hidden;
    background: var(--bianco);
  }
  .dona {
    background: var(--nero); color: var(--bianco); text-align: center;
    padding: .4em .5em;
    font-size: clamp(22px, 2.9vw, 60px); line-height: 1; font-weight: 800;
    text-transform: uppercase; letter-spacing: .01em;
  }
  .qrbox { flex: 1 1 0; min-height: 0; position: relative; }
  .qrbox img {
    position: absolute; inset: 4%; width: 92%; height: 92%;
    object-fit: contain; display: block;
  }

  /* striscia partner e patrocinio */
  .partner {
    border-top: var(--bordo) solid var(--nero);
    padding: clamp(8px, 1.4vh, 18px) clamp(18px, 4vw, 72px);
    display: flex; align-items: center; justify-content: center;
    gap: clamp(18px, 3.2vw, 64px); flex-wrap: wrap;
  }
  .partner .etichetta {
    font-size: clamp(11px, .8vw, 16px); font-weight: 800; color: var(--grigio);
    text-transform: uppercase; letter-spacing: .08em;
  }
  .partner img { display: block; height: clamp(36px, 6.4vh, 76px); width: auto; }
  .partner img.largo { height: clamp(40px, 7.4vh, 88px); }

  /* ---------- telefono / finestre strette ---------- */
  @media (max-width: 860px), (max-aspect-ratio: 1/1) {
    .testata { grid-template-columns: 1fr; justify-items: center; gap: 14px; padding-top: 18px; }
    .logo { grid-column: 1; height: clamp(120px, 34vw, 200px); }
    .timer { grid-column: 1; justify-self: center; }
    .timer .tempo { font-size: clamp(34px, 11vw, 60px); }
    .timer .etichetta { font-size: 13px; }
    .stage { grid-template-columns: minmax(0, 1fr); flex: none; }
    .card-head { font-size: 15px; }
    .dest { flex-direction: column; }
    .dest-testo { font-size: clamp(15px, 4vw, 22px); }
    .dest-logo { flex-basis: auto; padding: 16px 22%; }
    .qr-col { max-width: 460px; width: 100%; margin: 0 auto; }
    .dona { font-size: clamp(24px, 7vw, 44px); }
    .qrbox { flex: none; aspect-ratio: 1 / 1; }
    .partner img { height: 44px; }
    .partner img.largo { height: 52px; }
  }
  @media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }

  /* ---------- ?blacksquare=1: metà sinistra spenta (nera), a destra una colonna verticale
     con logo, QR e loghi dei partner, tutti larghi quanto il QR ---------- */
  .black-square body { background: var(--nero); }
  .black-square .pagina { flex-direction: row; height: 100vh; min-height: 0; }
  .black-square .spento { flex: 1 1 50%; background: var(--nero); }
  .black-square .colonna {
    --w: min(40vw, 50vh);
    flex: 1 1 50%; background: var(--bianco);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(10px, 2.4vh, 32px); padding: clamp(10px, 2.5vh, 32px) 0; overflow: hidden;
  }
  .black-square .colonna .testata {
    display: flex; align-items: center; justify-content: center; gap: clamp(10px, 1.4vw, 24px);
    width: var(--w); max-width: none; margin: 0; padding: 0;
  }
  .black-square .colonna .logo { height: clamp(90px, 17vh, 220px); }
  .black-square .colonna .timer .tempo { font-size: clamp(22px, 3.6vh, 54px); }
  .black-square .colonna .timer .etichetta { font-size: clamp(10px, 1.3vh, 18px); }
  .black-square .colonna .qr-col { width: var(--w); flex: none; }
  .black-square .colonna .dona { font-size: clamp(22px, 5.2vh, 64px); }
  .black-square .colonna .qrbox { flex: none; aspect-ratio: 1 / 1; }
  .black-square .colonna .partner {
    width: var(--w); border-top: 0; padding: 0;
    gap: clamp(8px, 1vw, 16px); justify-content: space-between; flex-wrap: nowrap;
  }
  .black-square .colonna .partner .etichetta { display: none; }
  .black-square .colonna .partner img,
  .black-square .colonna .partner img.largo { height: auto; max-height: 6.5vh; min-width: 0; flex: 0 1 auto; max-width: 30%; object-fit: contain; }
  @media (max-aspect-ratio: 1/1) {
    .black-square .pagina { height: auto; min-height: 100vh; }
    .black-square .spento { display: none; }
    .black-square .colonna { --w: min(88vw, 460px); }
  }
</style>
</head>
<body>
<div class="pagina">

<header class="testata">
  <img class="logo" src="logo.png" alt="Comedian per Gaza">
  <div class="timer" id="timer" aria-live="off">
    <span class="etichetta" id="timerEtichetta">In scena dalle 11:00</span>
    <span class="tempo" id="timerTempo">00:00:00</span>
  </div>
</header>

<main class="stage">
  <section class="sinistra">
    <div class="widget-card" id="widgetCard">
      <div class="card-head">
        <span>La raccolta</span>
        <span class="live">in diretta da GoFundMe</span>
      </div>
      <div class="widget-body">
        <!-- WIDGET GOFUNDME (Condividi > Incorpora). Se cambia, sostituisci il div e lo script in fondo. -->
        <div class="gfm-scala" id="gfmScala">
          <div class="gfm-embed" data-url="https://www.gofundme.com/f/comedian-per-gaza-2026/widget/medium/"></div>
        </div>
        <div class="fallback">
          La raccolta è su
          <a href="https://www.gofundme.com/f/comedian-per-gaza-2026" target="_blank" rel="noopener noreferrer">GoFundMe</a>:
          inquadra il QR per donare.
        </div>
      </div>
    </div>

    <div class="dest">
      <div class="dest-testo">
        <span>Tutto il ricavato va alla <b>Fondazione Soleterre ETS</b> per i bambini
        e le famiglie dell'ospedale Nasser di Khan Younis, a Gaza.</span>
      </div>
      <div class="dest-logo"><img src="loghi/soleterre.png" alt="Fondazione Soleterre"></div>
    </div>
  </section>

  <a class="qr-col" href="https://www.gofundme.com/f/comedian-per-gaza-2026" target="_blank" rel="noopener noreferrer"
     aria-label="Dona su GoFundMe: inquadra il QR o tocca qui">
    <div class="dona">Dona ora</div>
    <div class="qrbox"><img src="qr-gofundme.png" width="1000" height="1000" alt="QR code per donare su GoFundMe a Comedian per Gaza 2026"></div>
  </a>
</main>

<footer class="partner" aria-label="Partner e patrocinio">
  <span class="etichetta">Con</span>
  <img src="loghi/ciq.png" alt="C.I.Q. Centro Internazionale di Quartiere">
  <img src="loghi/pasta-cerati.png" alt="Pasta Cerati">
  <img src="loghi/hemp-club.png" alt="The Hemp Club, associazione culturale">
  <img class="largo" src="loghi/patrocinio-municipio4.png" alt="Patrocinio del Municipio 4, Comune di Milano">
</footer>
</div>

<script defer src="https://www.gofundme.com/static/js/embed.js"></script>
<script>
(function () {
  "use strict";

  // ---------- ?blacksquare=1: metà pagina nera, a destra logo + QR + partner in colonna ----------
  var blackSquare = false;
  try {
    var qs = new URLSearchParams(location.search);
    blackSquare = ["blacksquare", "black_square", "black-square", "blackSquare"].some(function (k) { return qs.get(k) === "1"; });
  } catch (e) {}
  if (blackSquare) {
    document.documentElement.classList.add("black-square");
    var pagina = document.querySelector(".pagina");
    var spento = document.createElement("div"); spento.className = "spento"; spento.setAttribute("aria-hidden", "true");
    var colonna = document.createElement("div"); colonna.className = "colonna";
    colonna.appendChild(document.querySelector(".testata"));
    colonna.appendChild(document.querySelector(".qr-col"));
    colonna.appendChild(document.querySelector(".partner"));
    var stage = document.querySelector(".stage");
    stage.parentNode.removeChild(stage);            // via widget e riquadro Soleterre
    pagina.appendChild(spento);
    pagina.appendChild(colonna);
  }

  // ---------- timer: tempo trascorso dall'inizio (domenica 22/11/2026, 11:00 ora di Milano = 10:00 UTC) ----------
  // Visibile solo con ?timer=1 nell'indirizzo, es. raccolta.html?timer=1
  var conTimer = false;
  try { conTimer = new URLSearchParams(location.search).get("timer") === "1"; } catch (e) {}
  if (conTimer) document.documentElement.classList.add("con-timer");
  var INIZIO = Date.UTC(2026, 10, 22, 10, 0, 0);
  var timer = document.getElementById("timer");
  var et = document.getElementById("timerEtichetta");
  var tempo = document.getElementById("timerTempo");
  function due(n) { return (n < 10 ? "0" : "") + n; }
  function tick() {
    var diff = Math.floor((Date.now() - INIZIO) / 1000);
    var prima = diff < 0, s = Math.abs(diff);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    tempo.textContent = due(h) + ":" + due(m) + ":" + due(sec);
    timer.classList.toggle("prima", prima);
    et.textContent = prima ? "Si parte alle 11:00 tra" : "In scena dalle 11:00";
  }
  if (conTimer) { tick(); setInterval(tick, 250); }

  // ---------- widget GoFundMe ----------
  var REFRESH_MS = 2 * 60 * 1000;   // ricarica il widget ogni 2 minuti
  var card = document.getElementById("widgetCard");
  if (card && document.body.contains(card)) avviaWidget();   // con ?blacksquare=1 il widget non c'è

  function avviaWidget() {
  var box = card.querySelector(".gfm-embed");
  var scala = document.getElementById("gfmScala");
  function frame() { return box.querySelector("iframe"); }

  // Il widget "medium" è largo 480px: lo ingrandiamo con transform (più affidabile
  // di zoom con gli iframe di altri siti) e diamo al contenitore la misura finale.
  var BASE = 480;
  function adatta() {
    var body = scala.parentElement, cs = getComputedStyle(body);
    var avail = body.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var z = Math.min(2.4, avail / BASE);
    if (window.innerWidth > 860 && window.innerWidth / window.innerHeight > 1) {
      z = Math.min(z, (window.innerHeight * 0.31) / 174);   // tutto in una schermata sul proiettore
    }
    z = Math.max(0.6, z);
    var h = box.offsetHeight || 174;
    box.style.transform = "scale(" + z.toFixed(3) + ")";
    scala.style.width = Math.round(BASE * z) + "px";
    scala.style.height = Math.round(h * z) + "px";
  }
  adatta();
  window.addEventListener("resize", adatta);
  if (window.ResizeObserver) new ResizeObserver(adatta).observe(box);

  // Se dopo 12 secondi il widget non è comparso, mostra il link di riserva.
  setTimeout(function () { if (!frame()) card.classList.add("ko"); }, 12000);

  // Sullo schermo dell'evento la pagina resta aperta ore: ricarichiamo solo il widget.
  setInterval(function () {
    var f = frame();
    if (!f || !f.src) return;
    try {
      var u = new URL(f.src);
      u.searchParams.set("_r", Date.now().toString(36));
      f.src = u.toString();
    } catch (e) { f.src = f.src; }
  }, REFRESH_MS);
  }

  // Proiettore: nascondi il cursore dopo 3 secondi di inattività.
  var t = null;
  function wake() {
    document.body.classList.remove("idle");
    clearTimeout(t);
    t = setTimeout(function () { document.body.classList.add("idle"); }, 3000);
  }
  ["mousemove", "touchstart", "keydown"].forEach(function (ev) {
    document.addEventListener(ev, wake, { passive: true });
  });
  wake();
})();
</script>
</body>
</html>
